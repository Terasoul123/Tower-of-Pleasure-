<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вежа Випробувань</title>
<style>
:root{--bg:#05070d;--fg:#dfe6ff;--panel:#141a2e;--accent:#7c4dff;--gold:#ffcc66;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#05070d;--fg:#dfe6ff;}}
:root[data-theme="dark"]{--bg:#05070d;--fg:#dfe6ff;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);overflow:hidden;font-family:'Courier New',monospace;color:var(--fg);}
#wrap{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;background:#05070d;}
#hud{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;padding:10px 14px;pointer-events:none;font-size:12px;}
.panel{background:rgba(10,14,26,.8);border:2px solid #2a3358;border-radius:6px;padding:8px 12px;display:inline-block;}
#hpbar{width:150px;height:11px;background:#2a3358;border-radius:3px;overflow:hidden;margin-top:5px;}
#hpfill{height:100%;background:linear-gradient(90deg,#ff4d6d,#ff8fa3);width:100%;}
#slots{display:flex;gap:6px;margin-top:7px;}
.slot{width:70px;height:34px;border:2px solid #3a4570;border-radius:6px;background:#0f1428;display:flex;align-items:center;justify-content:center;font-size:9px;text-align:center;padding:2px;}
.slot.active{border-color:var(--gold);box-shadow:0 0 8px var(--gold);}
#msg{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);font-size:20px;letter-spacing:2px;text-shadow:0 0 10px #000;opacity:0;transition:opacity .4s;pointer-events:none;text-align:center;white-space:nowrap;}
#hint{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);font-size:10px;opacity:.65;text-align:center;pointer-events:none;}
#overlay{position:absolute;inset:0;background:#05070d;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s;z-index:5;}
#logo{font-size:26px;letter-spacing:3px;color:#7c4dff;text-shadow:0 0 20px #7c4dff;opacity:0;transition:opacity .9s;}
#logo b{color:#dfe6ff;}
#loadbar{width:200px;height:7px;background:#1a2040;border-radius:4px;margin-top:22px;overflow:hidden;}
#loadfill{height:100%;width:0%;background:#7c4dff;}
#dmgFlash{position:absolute;inset:0;background:rgba(255,0,0,.25);opacity:0;pointer-events:none;transition:opacity .15s;}
.touchctl{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:4;touch-action:none;user-select:none;}
#joyBase{left:20px;width:110px;height:110px;border-radius:50%;background:rgba(20,26,46,.55);border:2px solid rgba(255,255,255,.15);}
#joyKnob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(124,77,255,.65);border:2px solid rgba(255,255,255,.35);}
#aimBase{right:20px;width:120px;height:120px;border-radius:50%;background:rgba(60,20,30,.55);border:2px solid rgba(255,120,140,.3);}
#aimKnob{position:absolute;left:38px;top:38px;width:44px;height:44px;border-radius:50%;background:rgba(255,77,109,.7);border:2px solid rgba(255,255,255,.4);}
#btnCluster{right:16px;bottom:calc(158px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;gap:8px;}
.actionBtn{width:64px;height:64px;border-radius:50%;background:rgba(124,77,255,.35);border:2px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;}
.actionBtn.small{width:46px;height:46px;font-size:13px;}
.hidden{display:none!important;}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c"></canvas>
<div id="dmgFlash"></div>
<div id="hud" class="hidden">
  <div class="panel">
    <div id="floorTxt">Поверх 1</div>
    <div id="roomsTxt" style="opacity:.7;font-size:10px;">Кімнат зачищено: 0/0</div>
    <div id="hpbar"><div id="hpfill"></div></div>
    <div id="slots"><div class="slot" id="slotA"></div><div class="slot" id="slotB"></div></div>
  </div>
</div>
<div id="msg"></div>
<div id="hint" class="hidden">WASD — рух · ЛКМ/Пробіл — атака · Q — зброя · E — взаємодія · Shift — ривок · G — кинути</div>
<div id="joyBase" class="touchctl hidden"><div id="joyKnob"></div></div>
<div id="aimBase" class="touchctl hidden"><div id="aimKnob"></div></div>
<div id="btnCluster" class="touchctl hidden">
  <div class="actionBtn small" id="btnDash">⚡</div>
  <div class="actionBtn small" id="btnReload">R</div>
  <div class="actionBtn small" id="btnSwitch">Q</div>
  <div class="actionBtn small" id="btnInteract">E</div>
  <div class="actionBtn small" id="btnAttack" style="display:none">⚔</div>
</div>
<div id="overlay">
  <div id="logo"><b>PIXEL</b> FORGE</div>
  <div id="loadbar" class="hidden"><div id="loadfill"></div></div>
</div>
</div>

const ANIMS={idle:{path:'assets/idle_{n}.png',fps:5,sx:1.2,sy:1.1},walk:{path:'assets/walk_{n}.png',fps:10,sx:1,sy:1}}; // sx/sy = розтяг по ширині/висоті (спокій трохи більший і ширший за біг)
SPR.size=64; // висота персонажа в грі (чим більше — тим більший)
function loadAnim(name,first){const arr=[];(function next(i){const im=new Image();im.onload=()=>{arr.push(im);if(i<60)next(i+1);else finishAnim(name,arr);};im.onerror=()=>{if(!arr.length&&first===1)loadAnim(name,0);else finishAnim(name,arr);};im.src=ANIMS[name].path.replace('{n}',first+i);})(0);}
function loadEmbedded(name){const D=(window.SPRITE_DATA||{})[name+'Frames'];if(!D)return;let left=D.length;const arr=[];D.forEach(s=>{const im=new Image();arr.push(im);im.onload=()=>{if(!--left)finishAnim(name,arr);};im.src=s;});}
function finishAnim(name,arr){if(!arr.length){loadEmbedded(name);return;}const S=SPR[name];S.frames=arr;S.n=arr.length;S.fps=ANIMS[name].fps;S.sx=ANIMS[name].sx||1;S.sy=ANIMS[name].sy||1;S.ok=true;S.pad=0;
 try{const c=document.createElement('canvas'),g=c.getContext('2d');let pad=1e9;
  arr.forEach(im=>{c.width=im.naturalWidth;c.height=im.naturalHeight;g.clearRect(0,0,c.width,c.height);g.drawImage(im,0,0);const d=g.getImageData(0,0,c.width,c.height).data;let b=c.height-1;
   for(;b>0;b--){let hit=false;for(let x=0;x<c.width;x++)if(d[(b*c.width+x)*4+3]>20){hit=true;break;}if(hit)break;}
   pad=Math.min(pad,c.height-1-b);});
  S.pad=pad;}catch(e){}}

// ===== camera =====
function computeCam(){camScale=Math.min(2.2,Math.max(.9,Math.min(cv.width/460,cv.height/340)));
 const hw=cv.width/camScale/2,hh=cv.height/camScale/2;
 const cx=W>2*hw?clamp(camX,hw,W-hw):W/2,cy=H>2*hh?clamp(camY,hh,H-hh):H/2;
 camOffX=cv.width/2-cx*camScale+shake*(Math.random()-.5)*2;camOffY=cv.height/2-cy*camScale+shake*(Math.random()-.5)*2;}
function updateFx(dt){updateWells(dt);
 const ao=player.aimOn?1:0,tx=player.x+player.facing.x*(40+ao*70),ty=player.y+player.facing.y*(30+ao*55);
 if(Math.hypot(tx-camX,ty-camY)>320){camX=tx;camY=ty;}else{const k=Math.min(1,dt*5);camX+=(tx-camX)*k;camY+=(ty-camY)*k;}
 shake*=Math.max(0,1-dt*9);tAnim+=dt;
 if(player.moving&&Math.random()<dt*12)burst(player.x,player.y+18,'#6a708c',1,30,.35,3);
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.92;p.vy*=.92;p.life-=dt;if(p.life<=0)parts.splice(i,1);}
 for(let i=floaters.length-1;i>=0;i--){const f=floaters[i];f.y-=40*dt;f.life-=dt;if(f.life<=0)floaters.splice(i,1);}
 if(slash){slash.t-=dt;if(slash.t<=0)slash=null;else deflectShots();}
}
function burst(x,y,col,n,spd,life,size){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=spd*(.4+Math.random()*.6);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:life*(.6+Math.random()*.4),max:life,size:size*(.6+Math.random()*.8),col});}}
function hitMonster(m,dmg,dx,dy){m.hp-=dmg;m.flash=.1;const l=Math.hypot(dx,dy)||1,kb=m.type==='spider'?160:220;m.kx=dx/l*kb;m.ky=dy/l*kb;
 const c=m.type==='slime'?'#ff7ac8':m.type==='skeleton'?'#e6dfcf':m.type==='bat'?'#9a5cff':'#8a8fa8';burst(m.x,m.y,c,6,160,.4,3);floaters.push({x:m.x,y:m.y-14,txt:Math.round(dmg),life:.7});shake=Math.min(14,shake+1.5);
 if(m.hp<=0){burst(m.x,m.y,c,22,260,.6,4);shake=Math.min(14,shake+4);}}
function curAim(){if(aimActive)return aimVec;return attackBtnHeld||(coarse&&!mouseDown)?player.facing:aimDir();}
function worldToScreen(x,y){return{x:camOffX+x*camScale,y:camOffY+y*camScale};}
function aimDir(){const sp=worldToScreen(player.x,player.y);const dx=mouseX-sp.x,dy=mouseY-sp.y;const len=Math.hypot(dx,dy);if(len<6)return player.facing;return{x:dx/len,y:dy/len};}

// ===== floor generation =====
function currentRoom(){return rooms[currentKey];}
function generateFloor(n){
 floorNum=n;rooms={};
 TEMPLATE.forEach(t=>{const key=t.x+','+t.y;rooms[key]={gx:t.x,gy:t.y,type:t.type,doors:{},cleared:t.type!=='combat',entered:t.type==='start',monsters:[],drops:[],chestOpened:false,tex:null};});
 Object.values(rooms).forEach(r=>{r.doors.n=!!rooms[r.gx+','+(r.gy-1)];r.doors.s=!!rooms[r.gx+','+(r.gy+1)];r.doors.e=!!rooms[(r.gx+1)+','+r.gy];r.doors.w=!!rooms[(r.gx-1)+','+r.gy];});
 currentKey='0,0';player.x=W/2;player.y=H/2;player.hp=player.maxhp;
 totalCombat=Object.values(rooms).filter(r=>r.type==='combat').length;clearedCombat=0;
 const shop=Object.values(rooms).find(r=>r.type==='shop');
 if(shop){const pool=[...WEAPONS].sort(()=>Math.random()-.5).slice(0,3);shop.drops=pool.map((w,i)=>({x:W/2-150+i*150,y:H/2,weapon:w}));}
 // ===== НАВЧАЛЬНА КІМНАТА ПЕРШОГО ПІДЗЕМЕЛЛЯ =====
 // На старті 1-го підземелля Золотий Шершень лежить у кімнаті як предмет для підбору.
 if(n===1){
   const tutorial=rooms['0,0'];
   if(tutorial){
     const goldHornet=WEAPONS.find(w=>w.id==='goldhornet');
     if(goldHornet) tutorial.drops.push({x:W/2+105,y:H/2,weapon:Object.assign({},goldHornet)});
   }
 }
 updateHud();
}
const SLIME_HUES=[0,-110,150];
function makeSlime(f){const hp=20+f*6;return{type:'slime',x:0,y:0,r:14,hp,maxhp:hp,dmg:8+f,state:'idle',t:.8+Math.random()*.6,vx:0,vy:0,target:{x:0,y:0},squish:1,contactDone:false,hue:SLIME_HUES[Math.floor(Math.random()*SLIME_HUES.length)]};}
function makeSpider(f){const hp=16+f*5;return{type:'spider',x:0,y:0,r:16,hp,maxhp:hp,dmg:9+f*1.2,speed:75+f*4,legPhase:Math.random()*6};}
function makeSkeleton(f){const hp=30+f*8;return{type:'skeleton',x:0,y:0,r:16,hp,maxhp:hp,dmg:10+f*1.5,speed:58+f*4,state:'walk',t:0,cd:.6,hit:false,ph:Math.random()*8,sd:Math.random()<.5?-1:1,sw:.5,dashCd:1.4,shots:0,at:0,kick:0,gh:[],face:1};}
function makeBat(f){const hp=24+f*6;return{type:'bat',x:0,y:0,r:15,hp,maxhp:hp,dmg:8+f*1.2,speed:62+f*3,state:'fly',t:0,cd:1.2+Math.random(),ph:Math.random()*8,sd:Math.random()<.5?-1:1,sw:.6,fp:Math.random()*9,flaps:0,last:0,face:1};}
function spawnMonstersForRoom(room){
 let list=[];
 if(floorNum===1){
  if(room.gx===1)list=[makeSlime(1),makeSlime(1)];
  else if(room.gx===-1)list=[makeSpider(1),makeSpider(1)];
   else list=[makeSlime(1),makeSpider(1)];
   list.push(makeSkeleton(1)); // тест: скелет у кожній бойовій кімнаті 1-го поверху
   list.push(makeBat(1)); // тест: кажан у кожній бойовій кімнаті 1-го поверху
  }else{
  const n=2+Math.min(4,Math.floor(floorNum/2));
  for(let i=0;i<n;i++){const r=Math.random();list.push(r<.34?makeSlime(floorNum):r<.67?makeSpider(floorNum):makeBat(floorNum));}
 }
 list.forEach(m=>{m.x=clamp(W/2+(Math.random()-.5)*420,WALL+m.r+10,W-WALL-m.r-10);m.y=clamp(H/2+(Math.random()-.5)*260,WALL+m.r+10,H-WALL-m.r-10);});
 room.monsters=list;
}

// ===== movement/doors =====
function tryMove(dx,dy){
 const room=currentRoom();const locked=room.type==='combat'&&room.entered&&!room.cleared;
 let nx=player.x+dx,ny=player.y+dy;
 const gapW=room.doors.w&&!locked&&Math.abs(player.y-H/2)<DOORW/2;
 const gapE=room.doors.e&&!locked&&Math.abs(player.y-H/2)<DOORW/2;
 const gapN=room.doors.n&&!locked&&Math.abs(player.x-W/2)<DOORW/2;
 const gapS=room.doors.s&&!locked&&Math.abs(player.x-W/2)<DOORW/2;
 if(nx<WALL+player.r){if(gapW){if(nx<0){doorTransition('w');return;}}else nx=WALL+player.r;}
 if(nx>W-WALL-player.r){if(gapE){if(nx>W){doorTransition('e');return;}}else nx=W-WALL-player.r;}
 if(ny<WALL+player.r){if(gapN){if(ny<0){doorTransition('n');return;}}else ny=WALL+player.r;}
 if(ny>H-WALL-player.r){if(gapS){if(ny>H){doorTransition('s');return;}}else ny=H-WALL-player.r;}
 player.x=nx;player.y=ny;
}
function doorTransition(dir){
 const map={n:[0,-1],s:[0,1],e:[1,0],w:[-1,0]};const[ddx,ddy]=map[dir];const room=currentRoom();
 const newKey=(room.gx+ddx)+','+(room.gy+ddy);const nr=rooms[newKey];if(!nr)return;
 currentKey=newKey;
 if(dir==='n')player.y=H-WALL-player.r-6;else if(dir==='s')player.y=WALL+player.r+6;
 else if(dir==='e')player.x=WALL+player.r+6;else player.x=W-WALL-player.r-6;
 player.x=clamp(player.x,WALL+player.r,W-WALL-player.r);player.y=clamp(player.y,WALL+player.r,H-WALL-player.r);
 if(!nr.entered){nr.entered=true;if(nr.type==='combat')spawnMonstersForRoom(nr);}
 updateHud();
}

// ===== interaction =====
function nearestDrop(room,range){let best=null,bd=range;room.drops.forEach(d=>{const dd=Math.hypot(d.x-player.x,d.y-player.y);if(dd<bd){bd=dd;best=d;}});return best;}
function pickupDrop(room,d){const idx=room.drops.indexOf(d);room.drops.splice(idx,1);const w=d.weapon;
 if(!player.weapons[0])player.weapons[0]=w;else if(!player.weapons[1])player.weapons[1]=w;
 else{const old=player.weapons[player.active];room.drops.push({x:d.x,y:d.y,weapon:old});player.weapons[player.active]=w;}
 updateHud();showMsg('Піднято: '+w.name+(w.perk?' — '+w.perk:''),w.perk?2800:1000);}
function dropWeapon(){const w=player.weapons[player.active];if(!w)return;player.weapons[player.active]=null;currentRoom().drops.push({x:player.x,y:player.y,weapon:w});updateHud();}
function switchWeapon(){player.active=1-player.active;player.swing=null;player.arm=0;player.rl=0;updateHud();}
function doInteract(){
 const room=currentRoom();const d=nearestDrop(room,60);
 if(d){pickupDrop(room,d);return;}
 if(room.type==='chest'&&!room.chestOpened&&!roulette.active){if(Math.hypot(player.x-W/2,player.y-H/2)<80)startRoulette(room);return;}
 if(room.type==='stairs'){if(Math.hypot(player.x-W/2,player.y-H/2)<80)tryStairs();}
}
function startRoulette(room){roulette={active:true,t:1.1,room};showMsg('Рулетка зброї…',1300);}
function finishRoulette(){const room=roulette.room;roulette.active=false;const w=pickWeighted();room.chestOpened=true;room.drops.push({x:W/2,y:H/2,weapon:w});showMsg('Скриня: '+w.name+' ('+RARITY[w.rarity].n+')',1800);}
function tryStairs(){if(busy)return;if(clearedCombat>=totalCombat)nextFloor();else showMsg('Спочатку зачистіть кімнати з монстрами!',1400);}

function animateLoad(ms,cb){const start=performance.now();function step(t){const p=Math.min(1,(t-start)/ms);loadfill.style.width=(p*100)+'%';if(p<1)requestAnimationFrame(step);else cb();}requestAnimationFrame(step);}
function showLoadingThen(ms,cb){overlay.style.display='flex';overlay.style.opacity=1;logoEl.style.display='none';loadbarWrap.classList.remove('hidden');loadfill.style.width='0%';animateLoad(ms,()=>{cb();overlay.style.opacity=0;setTimeout(()=>{overlay.style.display='none';},400);});}
function enterDungeon(){if(busy)return;busy=true;showLoadingThen(700,()=>{generateFloor(1);scene='dungeon';hud.classList.remove('hidden');showMsg('Поверх 1',1500);busy=false;});}
function nextFloor(){if(busy)return;busy=true;const nf=floorNum+1;showLoadingThen(600,()=>{generateFloor(nf);showMsg('Поверх '+nf,1600);busy=false;});}

let pending=[];
function startReload(){const w=player.weapons[player.active];if(!w||w.type!=='ranged'||player.rl>0)return;if(w.ammo===undefined)w.ammo=w.mag;if(w.ammo>=w.mag)return;player.rl=w.rl;player.rlMax=w.rl;player.rlW=w;showMsg('Перезарядка…',500);}
function fireVolley(w,dir){const n=w.pellets||1,sp=w.spread||0;
 burst(player.x+dir.x*24,player.y-2+dir.y*24,w.col,5,150,.18,3);burst(player.x+dir.x*24,player.y-2+dir.y*24,'#fff',2,90,.1,3);
 parts.push({x:player.x,y:player.y-2,vx:-dir.y*80+(Math.random()-.5)*40,vy:dir.x*80-40,life:.5,max:.5,size:2,col:'#ffd24d'});
 shake=Math.min(14,shake+(w.kick||4)*.3);player.kick=w.kick||4;player.flash=.07;tryMove(-dir.x*(w.kick||4)*.12,-dir.y*(w.kick||4)*.12);
 for(let i=0;i<n;i++){const a=Math.atan2(dir.y,dir.x)+(n>1?(i-(n-1)/2)*.12:0)+(Math.random()-.5)*sp;

function holsterPose(w,slot,p,s){const fl=player.facing.x<0?-1:1,t=tAnim,mv=player.moving?1:.25,sw=Math.sin(t*9)*.05*mv+Math.sin(t*2)*.02,by=Math.abs(Math.sin(t*9))*1.2*mv*s;
  // зброя лежить ЗА спиною (малюється під героєм), центр зсунутий назад, щоб кінці виглядали над плечем і збоку; дві зброї — навхрест
  const mid=(w.spr&&w.spr.naturalWidth?w.spr.len*.32:((w.range||44)*.5+6)/2)*s;
  let a=slot?2.2:-2.0;a=fl>0?a:Math.PI-a;a+=sw*fl*(slot?-1:1);
  const cx=p.x-fl*BACK_X*s,cy=p.y-(BACK_Y-slot*2)*s-by;
  return{x:cx-Math.cos(a)*mid,y:cy-Math.sin(a)*mid,a};}
const BACK_X=15,BACK_Y=20; // зсув центру зброї за спиною (x — назад, y — вгору від центру героя)
function drawHolstered(layer,p,s){player.weapons.forEach((w,i)=>{if(!w||carryOf(w)!==layer)return;if(i===player.active&&player.arm>.001)return;
 let slot=0;for(let j=0;j<i;j++){if(player.weapons[j]&&carryOf(player.weapons[j])===layer)slot=1;}
 const h=holsterPose(w,slot,p,s);poseGun(w,h.x,h.y,h.a,s,false);});}
function drawHeldGun(p,s){const wp=player.weapons[player.active];if(!wp||player.arm<=.001)return;const ad=curAim(),ang=Math.atan2(ad.y,ad.x),fl=ad.x<0?-1:1;
 let slot=0;if(player.weapons[0]&&player.weapons[1]&&player.active===1&&carryOf(player.weapons[0])===carryOf(wp))slot=1;
 const h=holsterPose(wp,slot,p,s),e0=player.arm,e=1+2.70158*Math.pow(e0-1,3)+1.70158*Math.pow(e0-1,2),inv=1-e;
 let off=8-player.kick*.9+Math.sin(tAnim*3)*.6,tilt=-player.kick*.03*fl,dy=0;
 if(player.rl>0){const k=1-player.rl/player.rlMax;off=5;dy=Math.sin(k*Math.PI)*7;tilt=fl*(Math.sin(k*Math.PI)*.9+(k>.75?Math.sin((k-.75)*25)*.15:0));}
 const hx=p.x+Math.cos(ang)*off*s,hy=p.y-2*s+Math.sin(ang)*off*s+dy*s,ha=ang+tilt;
 let da=((h.a-ha+3*Math.PI)%(2*Math.PI))-Math.PI;
 const spin=(carryOf(wp)==='hip'?-fl*Math.PI*2:fl*Math.PI*.6)*inv;
 let x=h.x+(hx-h.x)*e,y=h.y+(hy-h.y)*e-Math.sin(Math.min(1,e0)*Math.PI)*9*s,a=ha+da*inv+spin;
 if(wp.type==='melee'&&player.swing&&e0>.95){const sw=player.swing,k=Math.min(1,sw.t/sw.dur),mm=wp.mel||{},E=k*k*(3-2*k);x=hx;y=hy;
  if(mm.style==='stab'){const q=k<.3?-k/.3*.5:k<.55?-.5+(k-.3)/.25*1.5:1-(k-.55)/.45,L=q*wp.range*.45*s;a=ang;x=hx+Math.cos(ang)*L;y=hy+Math.sin(ang)*L;}
  else if(mm.style==='spin')a=ang+sw.dir*Math.PI*2*E;
  else{const half=mm.arc||1.1;a=ang+sw.dir*(-half+2*half*E);}}
 poseGun(wp,x,y,a,s,player.flash>0&&player.arm>.9);
 if(e0<.98&&Math.random()<.5)parts.push({x:player.x+(Math.random()-.5)*10,y:player.y-8,vx:0,vy:-20,life:.2,max:.2,size:2,col:wp.col});}
function drawGunHud(){const w=player.weapons[player.active];if(!w||w.type!=='ranged'||scene!=='dungeon')return;const cx=cv.width/2,y=cv.height-34,pw=Math.min(6,Math.max(3,Math.floor(260/w.mag)));ctx.textAlign='center';ctx.font='bold 13px monospace';ctx.fillStyle='#dfe6ff';ctx.fillText(w.name+'  '+(w.ammo===undefined?w.mag:w.ammo)+'/'+w.mag,cx,y-12);
 const tw=w.mag*(pw+1),x0=Math.round(cx-tw/2);for(let i=0;i<w.mag;i++){ctx.fillStyle=i<(w.ammo===undefined?w.mag:w.ammo)?w.col:'rgba(255,255,255,.12)';ctx.fillRect(x0+i*(pw+1),y,pw,8);}
 if(player.rl>0){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(x0,y+12,tw,4);ctx.fillStyle='#fff';ctx.fillRect(x0,y+12,tw*(1-player.rl/player.rlMax),4);}}
function drawPlayer(){
 const p=worldToScreen(player.x,player.y),s=camScale;const flip=player.facing.x<0?-1:1;
 ctx.save();ctx.translate(p.x,p.y);ctx.scale(flip*s,s);
  if(SPR.idle.ok&&SPR.walk.ok){const S=player.moving?SPR.walk:SPR.idle,t=tAnim,fi=((Math.floor(t*S.fps)%S.n)+S.n)%S.n,k=SPR.k;
   ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(0,20,12,4,0,0,Math.PI*2);ctx.fill();
   ctx.save();ctx.setTransform(1,0,0,1,0,0);if(player.dashT>0)ctx.globalAlpha=.6;drawHolstered('back',p,s);ctx.restore(); // зброя за спиною — під спрайтом героя
ctx.translate(0,20);
  if(S.frames){}else if(player.moving){ctx.translate(0,-Math.abs(Math.sin(t*10))*4);ctx.rotate(Math.sin(t*10)*.07);ctx.scale(1+Math.sin(t*20)*.04,1-Math.sin(t*20)*.04);}
  else ctx.scale(1-Math.sin(t*3)*.02,1+Math.sin(t*3)*.03);
  if(player.dashT>0)ctx.globalAlpha=.6;
  if(S.frames){const im=S.frames[fi],kk=SPR.size/im.naturalHeight,kx=kk*S.sx,ky=kk*S.sy;ctx.drawImage(im,-im.naturalWidth*kx/2,-(im.naturalHeight-S.pad)*ky,im.naturalWidth*kx,im.naturalHeight*ky);}else ctx.drawImage(S.img,fi*S.w,0,S.w,S.h,-S.w*k/2,-S.h*k,S.w*k,S.h*k);
  ctx.restore();ctx.globalAlpha=1;
   drawHeldGun(p,s);
  return;}
 const bob=player.moving?Math.sin(player.anim)*3:0;
 ctx.fillStyle='#1c1f2b';ctx.fillRect(-8,10+bob,6,10);ctx.fillRect(2,10-bob,6,10);
 ctx.fillStyle='#232a3d';ctx.fillRect(-10,-8,20,20);
 ctx.fillStyle='#3fae8c';ctx.fillRect(-9,-9,18,5);
 ctx.fillStyle='#bcd9a0';ctx.beginPath();ctx.arc(0,-16,9,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#14161f';ctx.beginPath();ctx.arc(0,-20,9,3.4,6.2);ctx.fill();ctx.fillRect(-9,-22,18,6);
 const w=player.weapons[player.active];if(w){ctx.fillStyle=w.col;ctx.fillRect(6,-2,14,4);}
 ctx.restore();
}
function drawFx(){
 parts.forEach(p=>{const s=worldToScreen(p.x,p.y);ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.col;const z=p.size*camScale;ctx.fillRect(s.x-z/2,s.y-z/2,z,z);});ctx.globalAlpha=1;
 if(slash){const s=worldToScreen(slash.x,slash.y),k=1-slash.t/.18;ctx.strokeStyle=slash.col;ctx.lineWidth=Math.max(.5,7*camScale*(1-k));ctx.globalAlpha=1-k;ctx.beginPath();if(slash.style==='stab'){const e2=slash.r*camScale*(.5+.5*k);ctx.moveTo(s.x,s.y);ctx.lineTo(s.x+Math.cos(slash.a)*e2,s.y+Math.sin(slash.a)*e2);}else ctx.arc(s.x,s.y,slash.r*camScale*(.6+.4*k),slash.a-(slash.arc||1.1),slash.a+(slash.arc||1.1));ctx.stroke();ctx.globalAlpha=1;}
 ctx.font='bold '+Math.round(14*camScale)+'px monospace';ctx.textAlign='center';floaters.forEach(f=>{const s=worldToScreen(f.x,f.y);ctx.globalAlpha=Math.min(1,f.life*2);ctx.fillStyle='#ffe066';ctx.fillText(f.txt,s.x,s.y);});ctx.globalAlpha=1;
}
function render(){ctx.imageSmoothingEnabled=false;
 ctx.clearRect(0,0,cv.width,cv.height);
 if(scene==='lobby'){
  computeCam();if(!lobbyTex)lobbyTex=buildLobbyTexture();
  ctx.drawImage(lobbyTex,camOffX,camOffY,W*camScale,H*camScale);
  drawPortalGlow();bots.forEach(drawBot);drawFx();drawPlayer();
 }else if(scene==='dungeon'){
  computeCam();const room=currentRoom();if(!room.tex)room.tex=buildRoomTexture(room);
  ctx.drawImage(room.tex,camOffX,camOffY,W*camScale,H*camScale);
  drawDoorBarriers(room);
  room.drops.forEach(drawDrop);
  room.monsters.forEach(m=>{m.type==='slime'?drawSlime(m):m.type==='skeleton'?drawSkeleton(m):m.type==='bat'?drawBat(m):drawSpider(m);if(m.flash>0&&m.type!=='slime'&&m.type!=='spider'&&m.type!=='skeleton'&&m.type!=='bat'){const p=worldToScreen(m.x,m.y);ctx.fillStyle='rgba(255,255,255,.75)';ctx.beginPath();ctx.arc(p.x,p.y,m.r*camScale,0,Math.PI*2);ctx.fill();}});
  drawWells();projectiles.forEach(drawProjectile);drawFx();
  drawPlayer();drawGunHud();
  if(roulette.active){const p=worldToScreen(W/2,H/2-60);const idx=Math.floor(performance.now()/80)%WEAPONS.length;ctx.fillStyle='#ffcc66';ctx.font='16px monospace';ctx.textAlign='center';ctx.fillText(WEAPONS[idx].name,p.x,p.y);}
 }
}

// ===== boot =====
const SHOW_INTRO=false; // true = повернути заставку студії та завантаження
document.getElementById('btnReload').addEventListener('pointerdown',e=>{e.preventDefault();startReload();});
function boot(){if(!SHOW_INTRO){overlay.style.display='none';scene='lobby';hintEl.classList.remove('hidden');joyBase.classList.remove('hidden');document.getElementById('aimBase').classList.remove('hidden');btnCluster.classList.remove('hidden');return;}
 overlay.style.display='flex';overlay.style.opacity=1;
 setTimeout(()=>{logoEl.style.opacity=1;},100);
 setTimeout(()=>{logoEl.style.opacity=0;},1700);
 setTimeout(()=>{logoEl.style.display='none';loadbarWrap.classList.remove('hidden');animateLoad(900,()=>{
   overlay.style.opacity=0;setTimeout(()=>{overlay.style.display='none';scene='lobby';hintEl.classList.remove('hidden');joyBase.classList.remove('hidden');document.getElementById('aimBase').classList.remove('hidden');btnCluster.classList.remove('hidden');},450);
 });},2100);
}
boot();

// ===== main loop =====
let last=performance.now();
function loop(now){const dt=Math.max(0,Math.min(.033,(now-last)/1000));last=now;update(dt);render();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
