<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pixel Forge — Dungeon</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b10;color:#fff;font-family:monospace;image-rendering:pixelated}
canvas{display:block;width:100%;height:100%;background:#111}
#screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#080a0f;z-index:10}
#logo{font-size:clamp(30px,9vw,72px);font-weight:900;letter-spacing:4px;text-shadow:5px 5px 0 #202532;animation:logoIn .8s steps(5),logoOut .8s steps(5) 1.8s forwards}
@keyframes logoIn{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes logoOut{to{transform:scale(1.4);opacity:0}}
#loading{display:none;position:fixed;inset:0;z-index:9;background:#080a0f;align-items:center;justify-content:center;flex-direction:column}
.bar{width:min(320px,70vw);height:16px;border:3px solid #fff;margin-top:18px;padding:2px}.fill{height:100%;width:0;background:#fff;animation:load 1.8s steps(12) forwards}@keyframes load{to{width:100%}}
#hud{display:none;position:fixed;top:12px;left:12px;right:12px;z-index:3;pointer-events:none}
.panel{display:inline-block;background:#10151e;border:3px solid #596273;box-shadow:4px 4px 0 #050608;padding:8px 12px}
#hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:4;background:#10151e;border:2px solid #596273;padding:8px 12px;white-space:nowrap;pointer-events:none}
#controls{display:none;position:fixed;right:15px;bottom:15px;z-index:5}
.btn{background:#202633;color:#fff;border:3px solid #778197;box-shadow:4px 4px 0 #07090c;font:700 16px monospace;padding:12px;min-width:64px}
#lobbyTitle{display:none;position:fixed;top:45px;left:50%;transform:translateX(-50%);z-index:3;font-size:25px;text-shadow:3px 3px #000}
</style>
</head>
<body>
<div id="screen"><div id="logo">PIXEL FORGE</div></div>
<div id="loading"><b id="loadText">LOADING DUNGEON...</b><div class="bar"><div class="fill"></div></div></div>
<div id="hud"><div class="panel">FLOOR <span id="floor">1</span> &nbsp; ❤️ <span id="hp">100</span> &nbsp; 🔫 <span id="weapon">Blaster</span></div></div>
<div id="lobbyTitle">LOBBY</div>
<div id="hint">WASD / стрелки — движение • E — портал/скриня • SPACE — атака</div>
<div id="controls"><button class="btn" id="attack">⚔</button></div>
<canvas id="game"></canvas>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');
let W,H,mode='lobby',floor=1,keys={},player,rooms=[],currentRoom=0,shots=[],enemies=[],loot=[],portals=[],chest=null,locked=false;
const weapons=['Blaster','Shotgun','Sword','Wand','Laser','Bow','Boomerang','SMG','Axe','Magic Orb'];
let weaponIndex=0;
function resize(){W=c.width=innerWidth;H=c.height=innerHeight}addEventListener('resize',resize);resize();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rect(r,fill,stroke){x.fillStyle=fill;x.fillRect(r.x,r.y,r.w,r.h);if(stroke){x.strokeStyle=stroke;x.lineWidth=3;x.strokeRect(r.x,r.y,r.w,r.h)}}
function text(t,a,b,s=16){x.font='bold '+s+'px monospace';x.fillStyle='#fff';x.textAlign='center';x.fillText(t,a,b)}
function setupLobby(){
 mode='lobby';document.getElementById('hud').style.display='none';document.getElementById('lobbyTitle').style.display='block';document.getElementById('controls').style.display='block';
 player={x:W/2,y:H/2+80,r:15,hp:100};
}
function enterDungeon(){
 document.getElementById('lobbyTitle').style.display='none';document.getElementById('loading').style.display='flex';document.getElementById('screen').style.display='none';
 setTimeout(()=>{document.getElementById('loading').style.display='none';document.getElementById('hud').style.display='block';mode='dungeon';buildFloor()},1900);
}
function buildFloor(){
 floor=Math.max(1,floor);document.getElementById('floor').textContent=floor;
 rooms=[
  {x:0,y:0,w:W,h:H,type:'start'},
  {x:0,y:0,w:Math.min(W*.7,620),h:Math.min(H*.65,440),type:'battle'},
  {x:0,y:0,w:Math.min(W*.55,520),h:Math.min(H*.7,480),type:'shop'},
  {x:0,y:0,w:Math.min(W*.72,650),h:Math.min(H*.6,400),type:'chest'},
  {x:0,y:0,w:Math.min(W*.55,520),h:Math.min(H*.65,450),type:'battle'},
  {x:0,y:0,w:Math.min(W*.65,600),h:Math.min(H*.7,500),type:'stairs'}
 ];
 currentRoom=0;loadRoom(0);
}
function roomRect(r){return{x:(W-r.w)/2,y:(H-r.h)/2+20,w:r.w,h:r.h}}
function loadRoom(i){
 currentRoom=i;shots=[];loot=[];enemies=[];locked=false;chest=null;player.x=W/2;player.y=H/2+30;
 if(i===0){player.x=W/2;player.y=H-100;return}
 const R=roomRect(rooms[i]); player.x=R.x+R.w/2;player.y=R.y+R.h-65;
 if(rooms[i].type==='battle'){
  locked=true;let n=3+floor;
  for(let k=0;k<n;k++)enemies.push({x:R.x+45+Math.random()*(R.w-90),y:R.y+55+Math.random()*(R.h-110),r:13,hp:30+floor*5,spd:35+floor*2});
 }
 if(rooms[i].type==='chest')chest={x:R.x+R.w/2,y:R.y+R.h/2,open:false};
}
function drawRoom(){
 x.fillStyle='#171b23';x.fillRect(0,0,W,H);
 if(mode==='lobby'){drawLobby();return}
 const R=roomRect(rooms[currentRoom]);
 x.fillStyle='#292e39';x.fillRect(R.x,R.y,R.w,R.h);
 x.strokeStyle='#6c7484';x.lineWidth=8;x.strokeRect(R.x,R.y,R.w,R.h);
 for(let yy=R.y+18;yy<R.y+R.h-10;yy+=32)for(let xx=R.x+18;xx<R.x+R.w-10;xx+=32){
  x.fillStyle=((xx/32+yy/32)|0)%2?'#303642':'#2d333e';x.fillRect(xx,yy,28,28);
 }
 if(currentRoom===0)drawStart(R);
 if(rooms[currentRoom].type==='shop')drawShop(R);
 if(rooms[currentRoom].type==='chest')drawChest(R);
 if(rooms[currentRoom].type==='stairs')drawStairs(R);
 if(rooms[currentRoom].type==='battle')drawBattle(R);
 drawPlayer();drawEnemies();drawShots();
}
function drawLobby(){
 x.fillStyle='#1b2630';x.fillRect(0,0,W,H);
 for(let i=0;i<22;i++){x.fillStyle=i%2?'#24323a':'#202d35';x.fillRect((i*97)%W,(i*61)%H,72,42)}
 // buildings
 rect({x:70,y:100,w:180,h:120},'#344554','#72879a');rect({x:W-250,y:90,w:170,h:140},'#3b4654','#72879a');
 // portal
 x.beginPath();x.arc(W/2,125,54,0,Math.PI*2);x.fillStyle='#503c8c';x.fill();x.strokeStyle='#c59cff';x.lineWidth=6;x.stroke();
 text('PORTAL',W/2,205,18);
 // dummy players
 const bots=[[W/2-150,H/2],[W/2+150,H/2-60],[W/2+80,H/2+130]];
 bots.forEach((p,i)=>{drawCharacter(p[0],p[1],i?'#d25b6a':'#5bc7d2');text('Player'+(i+1),p[0],p[1]-24,11)});
 text('LOBBY',W/2,55,26);drawPlayer();
}
function drawStart(R){text('DUNGEON ENTRANCE',W/2,R.y+55,20);text('Explore the rooms',W/2,R.y+82,13);drawDoor(W/2,R.y+R.h-15,'EXIT')}
function drawDoor(a,b,label){rect({x:a-38,y:b-45,w:76,h:45},'#59402c','#b28a5b');text(label,a,b-55,11)}
function drawBattle(R){text(locked?'ROOM LOCKED':'CLEARED',W/2,R.y+30,15);for(let i=0;i<4;i++){rect({x:R.x+45+i*100,y:R.y+55,w:46,h:30},'#463a2d','#705f49')}}
function drawShop(R){text('SHOP',W/2,R.y+35,22);['Shotgun','Sword','Potion'].forEach((v,i)=>{rect({x:R.x+70+i*130,y:R.y+100,w:105,h:75},'#3a4351','#8893a7');text(v,R.x+122+i*130,R.y+145,12)})}
function drawChest(R){text(chest&&chest.open?'REWARD':'CHEST ROOM',W/2,R.y+35,20);if(chest&&!chest.open){rect({x:chest.x-35,y:chest.y-25,w:70,h:50},'#76512a','#d9a65d');text('E',chest.x,chest.y+65,15)}else if(chest){text('RARITY ROULETTE',W/2,R.y+100,19);text(weapons[weaponIndex],W/2,R.y+150,24)}}
function drawStairs(R){text('STAIRS',W/2,R.y+35,22);for(let i=0;i<7;i++)rect({x:R.x+R.w/2-95+i*15,y:R.y+R.h/2+i*28,w:190-i*30,h:18},'#70513d','#a57c5d');text('E — NEXT FLOOR',W/2,R.y+R.h-35,15)}
function drawCharacter(px,py,col='#6ad06a'){rect({x:px-11,y:py-12,w:22,h:25},col,'#111');rect({x:px-8,y:py-23,w:16,h:13},'#f0c49b','#111');rect({x:px-6,y:py-20,w:3,h:3},'#111');rect({x:px+3,y:py-20,w:3,h:3},'#111')}
function drawPlayer(){drawCharacter(player.x,player.y,'#61c7e8')}
function drawEnemies(){enemies.forEach(e=>{x.fillStyle='#b74d55';x.fillRect(e.x-13,e.y-13,26,26);x.fillStyle='#f0c49b';x.fillRect(e.x-8,e.y-8,16,12);x.fillStyle='#111';x.fillRect(e.x-5,e.y-5,3,3);x.fillRect(e.x+3,e.y-5,3,3);x.fillStyle='#e85d62';x.fillRect(e.x-15,e.y-20,30,3);x.fillStyle='#64d66e';x.fillRect(e.x-15,e.y-20,30*(e.hp/(30+floor*5)),3)})}
function drawShots(){shots.forEach(s=>{x.fillStyle='#ffe36b';x.fillRect(s.x-4,s.y-4,8,8)})}
function move(){
 let dx=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),dy=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0);
 if(dx||dy){let l=Math.hypot(dx,dy);player.x+=dx/l*3.2;player.y+=dy/l*3.2}
 if(mode==='lobby'){player.x=clamp(player.x,30,W-30);player.y=clamp(player.y,70,H-35)}
 else{
  const R=currentRoom?roomRect(rooms[currentRoom]):{x:0,y:0,w:W,h:H};
  player.x=clamp(player.x,R.x+20,R.x+R.w-20);player.y=clamp(player.y,R.y+50,R.y+R.h-20);
 }
}
function attack(){
 if(mode!=='dungeon'||locked===false)return;
 let angle=Math.atan2(-1,0);shots.push({x:player.x,y:player.y,vx:Math.cos(angle)*8,vy:Math.sin(angle)*8});
}
function interact(){
 if(mode==='lobby'&&Math.hypot(player.x-W/2,player.y-125)<75){enterDungeon();return}
 if(mode!=='dungeon')return;
 const typ=rooms[currentRoom].type;
 if(typ==='chest'&&chest&&!chest.open&&Math.hypot(player.x-chest.x,player.y-chest.y)<90){chest.open=true;weaponIndex=Math.floor(Math.random()*weapons.length);document.getElementById('weapon').textContent=weapons[weaponIndex]}
 if(typ==='stairs'&&Math.hypot(player.x-W/2,player.y-(H/2+roomRect(rooms[currentRoom]).h/2-35))<110){floor++;buildFloor()}
}
addEventListener('keydown',e=>{keys[e.key]=true;if(e.code==='Space')attack();if(e.key.toLowerCase()==='e')interact()});
addEventListener('keyup',e=>keys[e.key]=false);
document.getElementById('attack').onclick=attack;
let last=performance.now();
function loop(now){
 const dt=Math.min(.033,(now-last)/1000);last=now;move();
 if(mode==='dungeon'){
  shots.forEach(s=>{s.x+=s.vx;s.y+=s.vy});
  shots=shots.filter(s=>s.x>-20&&s.x<W+20&&s.y>-20&&s.y<H+20);
  enemies.forEach(e=>{let dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*e.spd*dt;e.y+=dy/d*e.spd*dt;if(d<28)player.hp=Math.max(0,player.hp-.35)});
  for(const s of shots)for(const e of enemies)if(Math.hypot(s.x-e.x,s.y-e.y)<20){e.hp-=20;s.x=-999}
  enemies=enemies.filter(e=>e.hp>0);
  if(locked&&enemies.length===0)locked=false;
  document.getElementById('hp').textContent=Math.round(player.hp);
  if(player.hp<=0){alert('You died! Returning to lobby.');setupLobby()}
 }
 x.clearRect(0,0,W,H);drawRoom();requestAnimationFrame(loop);
}
setTimeout(()=>{document.getElementById('screen').style.display='none';document.getElementById('loading').style.display='flex';setTimeout(()=>{document.getElementById('loading').style.display='none';setupLobby()},1900)},2600);
requestAnimationFrame(loop);
</script>
</body>
</html>
